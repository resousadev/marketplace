spring:
  application:
    name: marketplace-test

  # Profile de teste desabilitado para deixar Testcontainers trabalhar
  profiles:
    active: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  data:
    mongodb:
      auto-index-creation: true

  redis:
    timeout: 2000ms

  docker:
    compose:
      lifecycle-management: none

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

# Testcontainers configuration
testcontainers:
  lifecycle-management: none
