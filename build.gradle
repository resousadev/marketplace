plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    // id 'jacoco'  // TODO: Ativar quando suportar Java 25

    id 'io.freefair.lombok' version '9.2.0'
}

group = 'dio'
version = '0.0.1-SNAPSHOT'
description = 'marketplace'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // AssertJ para assertions fluentes
    testImplementation 'org.assertj:assertj-core:3.24.1'

    // DataFaker (moderno, fork atualizado do JavaFaker - sem bug de SnakeYAML)
    testImplementation 'net.datafaker:datafaker:2.2.2'

    // Testcontainers (será adicionado após resolver compatibilidade)
    // TODO: Adicionar quando houver compatibilidade total com Spring Boot 4.0.6

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'redis.clients:jedis'

    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.data:spring-data-rest-hal-explorer'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Separar testes unitários de integração
task unitTest(type: Test) {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    description 'Run unit tests only'
}

task integrationTest(type: Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter unitTest
    description 'Run integration tests only'
}

